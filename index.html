<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- title & logo -->
    <title>GitHub Issue Tracker Apps</title>
    <link rel="stylesheet" href="assets/github-logo.png">
    
    <!-- font-awesome  -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/
               ajax/libs/font-awesome/7.0.1/css/all.min.css" 
               integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/
               kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==
              " crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- font intigration -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    
    <!-- tailwind & daisy-Ui -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
 
<body class="bg-gray-200 flex items-center justify-center min-h-screen">
    <!-- Card -->
  <div class="bg-white w-[480px] p-10 rounded-lg shadow-md">

    <!-- Logo -->
    <div class="text-center mb-6">
        <img src="https://cdn-icons-png.flaticon.com/512/25/25231.png"
        class="w-14 mx-auto mb-3">

        <h1 class="text-xl font-semibold text-gray-800">
            GitHub Issues Tracker
        </h1>

        <p class="text-gray-400 text-sm">
            Sign in to manage your issues
        </p>
    </div>


    <!-- Username -->
    <div class="mb-4">
        <label class="text-sm text-gray-700">
            Username
        </label>

        <!-- ID added for username input -->
        <input id="username" type="text"
        placeholder="Enter Username"
        class="w-full border border-gray-300 rounded-md p-4 mt-1 focus:outline-none">

        <p class="text-xs text-purple-600 mt-1">
            Default: admin
        </p>
    </div>


    <!-- Password -->
    <div class="mb-5">
        <label class="text-sm text-gray-700">
            Password
        </label>

        <!-- ID added for password input -->
        <input id="password" type="password"
        placeholder="Enter Password"
        class="w-full border border-gray-300 rounded-md p-4 mt-1 focus:outline-none">

        <p class="text-xs text-purple-600 mt-1">
            Default: admin123
        </p>
    </div>


    <!-- Button -->
    <!-- ID added for login button -->
    <button id="loginBtn" class="w-full bg-purple-700 text-white py-3 rounded-md hover:bg-purple-800 transition">
        Sign In
    </button>


    <!-- OR -->
    <div class="flex items-center gap-3 my-5">
        <div class="flex-1 h-[1px] bg-gray-300"></div>
        <p class="text-sm text-gray-500">OR</p>
        <div class="flex-1 h-[1px] bg-gray-300"></div>
    </div>


    <!-- Demo Credentials -->
    <div class="bg-gray-100 p-4 rounded text-center">

        <p class="text-sm text-gray-500 mb-2">
            Demo Credentials:
        </p>

        <p class="text-sm font-medium">
            Username: admin
        </p>

        <p class="text-sm font-medium">
            Password: admin123
        </p>

    </div>

  </div>


<script>
    // login button select
    const loginBtn = document.getElementById("loginBtn");

    // button click event
    loginBtn.addEventListener("click", function(){

    // input value
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    // demo credentials
    if(username === "admin" && password === "admin123"){
    // go to dashboard
        window.location.href = "card.html";
    }
    else{
        alert("Wrong username or password");
    }

});

</script> 
</body>
</html>
